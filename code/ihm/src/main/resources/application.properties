# The host chooses the port through the PORT variable.
server.port=${PORT:8080}
# Render ends HTTPS in front of the application: the redirect sent to Google must still say https.
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURISE:false}
echecs.stockfish.executable=${STOCKFISH:stockfish}

# Default: the local development database, which holds no real data. The host gives its own address.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/caissa?user=caissa&password=caissa}
# A small pool that empties when idle: it lets the hosted database go to sleep, and spares memory.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# Migrations need a direct connection: Neon's pooler does not keep a session.
spring.flyway.url=${JDBC_DATABASE_URL_DIRECTE:${spring.datasource.url}}

echecs.google.client-id=${GOOGLE_CLIENT_ID:}
echecs.google.client-secret=${GOOGLE_CLIENT_SECRET:}
echecs.admin.pseudo=${ADMIN_PSEUDO:}
echecs.admin.email=${ADMIN_EMAIL:}
